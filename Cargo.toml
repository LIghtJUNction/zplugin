[package]
name = "zplugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-dependency native plugin ABI and optional fuel-metered WebAssembly sandbox"
readme = "README.md"
keywords = ["plugin", "ffi", "no-std", "dynamic", "hot-reload"]
categories = ["no-std", "api-bindings"]
include = ["src/**", "README.md", "LICENSE-*", "docs/abi.md", "docs/extensions.md", "docs/wasm.md", "Cargo.toml", "Cargo.lock"]

[workspace]
resolver = "2"
members = [".", "crates/zplugin-macros", "examples/interface", "examples/plugin", "examples/host", "examples/foreign/interface", "examples/async/interface", "examples/async/plugin", "examples/async/host", "tools/foreign-tests", "tools/bench", "tools/contract-tests"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zplugin"

[features]
default = []
alloc = []
std = ["alloc"]
macros = ["dep:zplugin-macros"]
hot-reload = ["alloc"]
wasm = ["alloc", "dep:wasmi"]

[dependencies]
zplugin-macros = { path = "crates/zplugin-macros", version = "=0.2.0", optional = true }
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "validate", "portable-dispatch", "libm"], optional = true }

[[example]]
name = "wasm_host"
path = "examples/wasm_host.rs"
required-features = ["wasm", "std"]

[[example]]
name = "wasm_bench"
path = "examples/wasm_bench.rs"
required-features = ["wasm", "std"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

