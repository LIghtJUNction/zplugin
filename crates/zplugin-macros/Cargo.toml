[package]
name = "zplugin-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compile-time interface generation for zplugin's frozen native plugin ABI"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "Cargo.toml", "LICENSE-*"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

